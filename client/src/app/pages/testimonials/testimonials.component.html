<section class="testimonials-section">
  <div class="container-fluid px-5">
    <h1 class="page-title">Testimonials & References</h1>

    <div *ngIf="loading" class="loading-container">
      <div class="spinner"></div>
      <p>Loading testimonials...</p>
    </div>

    <div *ngIf="!loading && testimonials.length === 0" class="empty-state">
      <p>No testimonials yet. Check back soon!</p>
    </div>

    <div class="testimonials-grid" *ngIf="!loading && testimonials.length > 0">
      <div *ngFor="let testimonial of testimonials" class="testimonial-card">
        <div class="testimonial-header">
          <img
            [src]="testimonial.image"
            alt="{{ testimonial.name }}"
            class="testimonial-image"
          />
          <div class="testimonial-info">
            <h3 class="testimonial-name">{{ testimonial.name }}</h3>
            <p class="testimonial-title">{{ testimonial.title }}</p>
            <p *ngIf="testimonial.company" class="testimonial-company">
              {{ testimonial.company }}
            </p>
          </div>
        </div>

        <div class="rating">
          <span *ngFor="let star of getStars(testimonial.rating)" class="star">★</span>
        </div>

        <p class="testimonial-message">{{ testimonial.message }}</p>
      </div>
    </div>
  </div>
</section>
